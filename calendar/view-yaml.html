<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radionuclide Metrology Calendar</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/colreorder/1.5.5/js/dataTables.colReorder.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.2.2/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.html5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>

  <link href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" rel="stylesheet" >
  <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css" rel="stylesheet" >
  <link href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.css" rel="stylesheet" >
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400;1,700;1,900&display=swap" rel="stylesheet" >

  <style>
    body {font-family: 'Lato', sans-serif;}
    .excel-button {
        background-color: #217346 !important; /* Excel green color */
        color: white !important;
        border: 1px solid #217346 !important;
    }
    .float-right {
        float: right;
        margin-bottom: 10px;
    }
    .clearfix {
        clear: both;
    }
    table.dataTable tbody td {
        color: #444 !important;
    }
    table.dataTable thead th {
        color: #000 !important;
    }
  </style>
</head>
<body>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Function to load YAML file
        function loadYamlFile(fileName) {
            fetch(fileName)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Failed to load ${fileName}: ${response.status} ${response.statusText}`);
                    }
                    return response.text();
                })
                .then(yamlStr => {
                    processYamlContent(yamlStr);
                })
                .catch(error => {
                    console.error('Error loading or parsing YAML file:', error);
                    alert('Error loading or parsing YAML file: ' + error.message);
                });
        }

        // Function to process YAML content
        function processYamlContent(yamlStr) {
            try {
                const documents = jsyaml.loadAll(yamlStr);
                const dataDoc = documents[documents.length - 1];

                if (!Array.isArray(dataDoc) || dataDoc.length === 0) {
                    throw new Error("Invalid data format in YAML. Expected an array of objects.");
                }

                // Filter out past events using end-date
                const today = new Date();
                today.setHours(0,0,0,0); // normalize to midnight
                const filteredData = dataDoc.filter(event => {
                    if (!event["end-date"]) return true;
                    const eventEnd = new Date(event["end-date"]);
                    return eventEnd >= today;
                });

                if (filteredData.length === 0) {
                    alert("No upcoming events found.");
                }

                const dataArray = filteredData.map(obj => Object.values(obj));
                const headers = Object.keys(filteredData[0]).map(key => ({
                    title: key.charAt(0).toUpperCase() + key.slice(1)
                }));

                if ($.fn.DataTable.isDataTable('#myTable')) {
                    $('#myTable').DataTable().destroy();
                    $('#myTable').empty();
                }

                $('#myTable').DataTable({
                    data: dataArray,
                    responsive: true,
                    columns: headers,
                    dom: 'l<"float-right"B><"clearfix">frtip',
                    pageLength: -1,
                    lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "All"]],
                    colReorder: true,
                    buttons: [
                        {
                            extend: 'csv',
                            text: 'Export to .csv ...',
                            className: 'csv-button',
                            exportOptions: {
                                columns: ':visible'
                            }
                        },
                        {
                            extend: 'excel',
                            text: 'Export to .xlsx ...',
                            className: 'excel-button',
                        },
                    ],
                });
            } catch (error) {
                console.error('Error processing YAML:', error);
                alert('Error processing YAML: ' + error.message);
            }
        }

        // Load events.yaml directly on page load
        loadYamlFile("events.yaml");
    });
</script>

    <div style="width: 95%; margin: 0 auto; margin-top:40px">
        <h1 id="page-title">Radionuclide Metrology Calendar</h1>
        <table id="myTable" class="display" style="width:100%"></table>
    </div>
</body>
</html>
